<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yandex Game Template</title>
    
    <!-- Yandex Games SDK v2 -->
    <script src="https://yandex.ru/games/sdk/v2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            background: #222;
            max-width: 100%;
            max-height: 100%;
        }

        .ui-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            min-width: 280px;
            z-index: 10;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary { background: #2196F3; }
        button.reward { background: #FF9800; }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD верхняя панель -->
        <div id="hud">
            <div id="score-display">Очки: 0</div>
            <div id="gems-display">💎 0</div>
        </div>

        <!-- Игровой холст -->
        <canvas id="canvas" width="800" height="600"></canvas>

        <!-- Главное меню / Экран окончания -->
        <div id="main-menu" class="ui-panel">
            <h1 id="menu-title">Игра</h1>
            <p id="high-score-text" style="margin: 10px 0;">Рекорд: 0</p>
            <p id="rank-text" style="margin-bottom: 15px; font-size: 14px; color: #FFD700;"></p>
            
            <button id="start-btn">Старт</button>
            <button id="reward-btn" class="reward hidden">Получить +10 💎 за рекламу</button>
            <button id="buy-gems-btn" class="secondary">Купить 50💎</button>
        </div>
    </div>

    <script>
        // 1. Локализация (По образцу)
        const locales = {
            ru: {
                title: "Моя Игра",
                start: "Играть",
                score: "Очки: ",
                gems: "💎 ",
                record: "Рекорд: ",
                rank: "Место в рейтинге: ",
                rewardBtn: "Получить +10 💎 (Реклама)",
                buyBtn: "Купить 50💎 / %d YAN",
                successPurchase: "Покупка успешна!",
                adError: "Ошибка показа рекламы"
            },
            en: {
                title: "My Game",
                start: "Play",
                score: "Score: ",
                gems: "💎 ",
                record: "Record: ",
                rank: "Leaderboard position: ",
                rewardBtn: "Get +10 💎 (Watch Ad)",
                buyBtn: "Buy 50💎 / %d YAN",
                successPurchase: "Purchase successful!",
                adError: "Ad error occurred"
            }
        };

        // Состояние игры
        let currentLang = 'ru';
        let yandexSDK = null;
        let player = null;
        let payments = null;
        
        let score = 0;
        let maxScore = 0;
        let gems = 0;
        
        let isPaused = false;
        let isAdShowing = false;
        let animationFrameId = null;

        // Элементы DOM
        const menuTitle = document.getElementById('menu-title');
        const startBtn = document.getElementById('start-btn');
        const rewardBtn = document.getElementById('reward-btn');
        const buyGemsBtn = document.getElementById('buy-gems-btn');
        const scoreDisplay = document.getElementById('score-display');
        const gemsDisplay = document.getElementById('gems-display');
        const highScoreText = document.getElementById('high-score-text');
        const rankText = document.getElementById('rank-text');
        const mainMenu = document.getElementById('main-menu');

        // Отключение контекстного меню и системных клавиш
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });

        // 2. Инициализация Yandex SDK (По образцу)
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof YaGames !== 'undefined') {
                YaGames.init().then(ysdk => {
                    yandexSDK = ysdk;

                    // Определение языка
                    currentLang = ysdk.environment.i18n?.lang?.startsWith('en') ? 'en' : 'ru';
                    updateUI();

                    // Регистрация системных паузок от платформы
                    ysdk.on('game_api_pause', gamePause);
                    ysdk.on('game_api_resume', gameUnPause);

                    // Авторизация игрока и загрузка прогресса
                    ysdk.getPlayer().then(_player => {
                        player = _player;
                        loadProgress();
                    }).catch(err => console.log('Оффлайн игрок:', err));

                    // Инициализация внутриигровых покупок (In-App Purchases)
                    ysdk.getPayments({ signed: true }).then(_payments => {
                        payments = _payments;
                        
                        // Загрузка цен из каталога
                        payments.getCatalog().then(products => {
                            const gemProduct = products.find(p => p.id === 'gem50');
                            if (gemProduct) {
                                buyGemsBtn.textContent = locales[currentLang].buyBtn.replace('%d', gemProduct.priceValue);
                            }
                        });

                        // Потребление незавершенных покупок
                        payments.getPurchases().then(purchases => {
                            purchases.forEach(p => {
                                if (p.productID === 'gem50') gems += 50;
                                payments.consumePurchase(p.purchaseToken);
                            });
                            saveProgress();
                        });
                    }).catch(err => console.log('Покупки недоступны'));

                    // Уведомление платформы о готовности
                    ysdk.features.LoadingAPI?.ready();

                    // Показ Meжстраничной рекламы при старте
                    showFullscreenAd();
                }).catch(err => {
                    console.warn('Ошибка инициализации SDK, запуск в автономном режиме', err);
                    updateUI();
                });
            } else {
                updateUI();
            }
        });

        // 3. Сохранение и загрузка прогресса
        async function loadProgress() {
            if (!player) return;
            try {
                const data = await player.getData();
                if (data) {
                    gems = parseInt(data.gems) || 0;
                    maxScore = parseInt(data.maxScore) || 0;
                    updateUI();
                }
            } catch (e) {
                console.error('Ошибка загрузки данных', e);
            }
        }

        async function saveProgress() {
            if (!player) return;
            try {
                await player.setData({ gems, maxScore }, true);
            } catch (e) {
                console.error('Ошибка сохранения данных', e);
            }
        }

        async function saveLeaderboardScore(newScore) {
            if (yandexSDK && newScore > maxScore) {
                try {
                    const lb = await yandexSDK.getLeaderboards();
                    await lb.setLeaderboardScore('leaderboardMain', newScore);
                    loadLeaderboardPosition();
                } catch (e) {
                    console.log('Лидерборды недоступны');
                }
            }
        }

        async function loadLeaderboardPosition() {
            if (!yandexSDK || !player) return;
            try {
                const lb = await yandexSDK.getLeaderboards();
                const res = await lb.getLeaderboardEntries('leaderboardMain', { includeUser: true });
                const userEntry = res.entries.find(e => e.player.uniqueID === player.getUniqueID());
                if (userEntry) {
                    rankText.textContent = locales[currentLang].rank + userEntry.rank;
                }
            } catch (e) {
                console.log('Не удалось загрузить рейтинг');
            }
        }

        // 4. Логика рекламы (Fullscreen & Rewarded)
        function showFullscreenAd() {
            if (!yandexSDK) return;
            isAdShowing = true;
            gamePause();
            
            yandexSDK.adv.showFullscreenAdv({
                callbacks: {
                    onClose: () => { isAdShowing = false; gameUnPause(); },
                    onError: () => { isAdShowing = false; gameUnPause(); }
                }
            });
        }

        rewardBtn.addEventListener('click', () => {
            if (!yandexSDK) return;
            isAdShowing = true;
            gamePause();

            yandexSDK.adv.showRewardedVideo({
                callbacks: {
                    onOpen: () => {},
                    onRewarded: () => {
                        gems += 10;
                        saveProgress();
                        updateUI();
                    },
                    onClose: () => { isAdShowing = false; gameUnPause(); },
                    onError: () => { isAdShowing = false; gameUnPause(); }
                }
            });
        });

        // 5. Логика внутриигровых покупок
        buyGemsBtn.addEventListener('click', async () => {
            if (!payments) return;
            try {
                const purchase = await payments.purchase({ id: 'gem50' });
                await payments.consumePurchase(purchase.purchaseToken);
                gems += 50;
                saveProgress();
                updateUI();
            } catch (e) {
                console.log('Покупка отменена');
            }
        });

        // 6. Фокус и Пауза
        function gamePause() {
            isPaused = true;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            // TODO: Приглушить звук (muteAudio)
        }

        function gameUnPause() {
            if (isAdShowing || document.hidden) return;
            isPaused = false;
            // TODO: Возобновить звук (unmuteAudio)
            if (mainMenu.classList.contains('hidden')) {
                gameLoop();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) gamePause();
            else gameUnPause();
        });

        // 7. Игровой цикл и UI
        function updateUI() {
            menuTitle.textContent = locales[currentLang].title;
            startBtn.textContent = locales[currentLang].start;
            rewardBtn.textContent = locales[currentLang].rewardBtn;
            scoreDisplay.textContent = locales[currentLang].score + score;
            gemsDisplay.textContent = locales[currentLang].gems + gems;
            highScoreText.textContent = locales[currentLang].record + maxScore;
            
            if (yandexSDK) rewardBtn.classList.remove('hidden');
        }

        function startGame() {
            mainMenu.classList.add('hidden');
            score = 0;
            updateUI();
            gameUnPause();
        }

        function gameOver() {
            gamePause();
            if (score > maxScore) {
                maxScore = score;
                saveProgress();
                saveLeaderboardScore(score);
            }
            mainMenu.classList.remove('hidden');
            updateUI();
        }

        function gameLoop() {
            if (isPaused) return;

            // TODO: Обновление механики игры
            score += 1;
            scoreDisplay.textContent = locales[currentLang].score + score;

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
