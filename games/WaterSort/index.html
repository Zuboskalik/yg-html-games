<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Water Sort / Сортировка по пробиркам</title>

    <!-- Yandex Games SDK v2 -->
    <script src="https://yandex.ru/games/sdk/v2"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- HUD -->
        <div id="hud">
            <div class="hud-group">
                <button class="menu-icon-btn" id="open-menu-btn" title="Меню">☰</button>
                <div id="level-title">Уровень 1</div>
                <div id="level-select"></div>
            </div>
            <div class="hud-group">
                <div id="moves-count">🔄 0</div>
                <div id="moves-limit-display" class="hidden">💣 0</div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Lock-condition hint toast -->
        <div id="lockHintToast"></div>

        <!-- Action Bar (Undo & Add Tube) -->
        <div id="action-bar">
            <button class="action-btn" id="undo-btn">
                <span>↩️</span> <span id="txt-undo">Отмена</span>
            </button>
            <button class="action-btn reward-badge" id="add-tube-btn">
                <span>🧪+</span> <span id="txt-add-tube">Колба</span>
            </button>
            <button class="action-btn reward-badge hidden" id="reveal-hidden-btn">
                <span>👁️</span> <span id="txt-reveal-hidden">Открыть</span>
            </button>
            <button class="action-btn reward-badge hidden" id="unlock-tube-btn">
                <span>🔓</span> <span id="txt-unlock-tube">Разблок.</span>
            </button>
        </div>

        <!-- Main Menu / Level Select Modal -->
        <div id="main-menu" class="ui-overlay">
            <div class="modal-card">
                <h1 id="menu-title">Water Sort</h1>
                <p id="menu-desc">Сортируй разноцветную жидкость по пробиркам!</p>
                <div class="level-preview-row">
                    <div id="current-level-preview" class="level-badge">Уровень 1</div>
                    <div id="menu-level-select"></div>
                </div>
                <div class="skin-select-row" id="skin-select-row">
                    <button class="skin-option" type="button" data-skin="tube">
                        <img src="images/water1.png" alt="">
                        <span class="skin-option-label" id="txt-skin-tube">Колба</span>
                        <span class="skin-lock-badge hidden" data-lock-badge>🔒</span>
                    </button>
                    <button class="skin-option" type="button" data-skin="bottle">
                        <img src="images/water4.png" alt="">
                        <span class="skin-option-label" id="txt-skin-bottle">Бутылка</span>
                        <span class="skin-lock-badge hidden" data-lock-badge>🔒</span>
                    </button>
                </div>
                <button class="btn" id="start-btn">Играть</button>
            </div>
        </div>

        <!-- Victory Modal -->
        <div id="victory-modal" class="ui-overlay hidden">
            <div class="modal-card">
                <h1 id="win-title">🎉 Уровень пройден!</h1>
                <p id="win-desc">Отличная работа! Все цвета аккуратно отсортированы.</p>
                <button class="btn" id="next-level-btn">Следующий уровень</button>
            </div>
        </div>

        <!-- Defeat Modal -->
        <div id="defeat-modal" class="ui-overlay hidden">
            <div class="modal-card">
                <h1 style="color: #ff4d4d;" id="fail-title">💥 Ходы закончились!</h1>
                <p id="fail-desc">Время бомбы истекло. Хотите продолжить или начать заново?</p>
                <button class="btn btn-reward" id="revive-btn">🎁 До +15 ходов (Реклама)</button>
                <button class="btn btn-secondary" id="restart-level-btn">Заново</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
